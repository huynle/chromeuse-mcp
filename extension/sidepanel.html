<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChromeUse MCP</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- Connection status -->
  <header id="status-bar">
    <div class="status-indicator">
      <span id="status-dot" class="dot disconnected"></span>
      <span id="status-text">Disconnected</span>
    </div>
    <div class="status-actions">
      <button id="connect-btn" class="connect-btn">Connect</button>
      <button id="disconnect-btn" class="disconnect-btn" disabled>Disconnect</button>
      <button id="stop-btn" class="stop-btn" disabled>Stop Automation</button>
    </div>
  </header>

  <section id="connection-hint" class="connection-hint">
    Start the MCP server, then click Connect to use WebSocket transport.
  </section>

  <!-- Workspace folder selection -->
  <section id="workspace-section" class="workspace-section">
    <div class="workspace-header">
      <h2>Workspace</h2>
      <button id="workspace-pick-btn" class="workspace-pick-btn">Choose Folder</button>
    </div>
    <div id="workspace-message" class="workspace-message hidden" role="status"></div>
    <div id="workspace-empty" class="workspace-empty">
      Select a local folder to enable workspace document access.
    </div>
    <dl id="workspace-metadata" class="workspace-metadata hidden">
      <div>
        <dt>Folder</dt>
        <dd id="workspace-folder-name">—</dd>
      </div>
      <div>
        <dt>Selected</dt>
        <dd id="workspace-selected-at">—</dd>
      </div>
      <div>
        <dt>Permission</dt>
        <dd id="workspace-permission">Unknown</dd>
      </div>
    </dl>
  </section>

  <!-- Workspace markdown preview (opened by workspace-tree integration events) -->
  <section id="document-section" class="markdown-section hidden"></section>

  <!-- Tool execution history -->
  <section id="history-section">
    <h2>Tool History</h2>
    <div id="tool-history" class="tool-list">
      <p class="empty-state">No tool executions yet.</p>
    </div>
  </section>

  <script src="dist/sidepanel/index.js" type="module"></script>
</body>
</html>
