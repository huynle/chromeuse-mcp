name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish as a GitHub Release, for example v0.1.0. Leave blank to build artifacts only."
        required: false
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure the release commit is on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2147483647 origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; releases must be tagged from main."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is on main."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: ./scripts/build.sh

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Package extension zip
        id: package
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          zip_name="chromeuse-mcp-extension-v${version}.zip"

          rm -rf release release-extension
          mkdir -p release release-extension

          cp extension/manifest.json release-extension/
          cp extension/sidepanel.html release-extension/
          cp extension/sidepanel.css release-extension/
          cp -R extension/assets release-extension/assets
          cp -R extension/dist release-extension/dist

          (cd release-extension && zip -qr "../release/${zip_name}" .)
          shasum -a 256 "release/${zip_name}" > "release/${zip_name}.sha256"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "zip_path=release/${zip_name}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=release/${zip_name}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromeuse-mcp-extension-v${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail

          tag=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag_name || '' }}" ]]; then
            tag="${{ inputs.tag_name }}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.release_tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag }}
          DRAFT: ${{ inputs.draft || false }}
          PRERELEASE: ${{ inputs.prerelease || false }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        shell: bash
        run: |
          set -euo pipefail

          flags=()
          if [[ "${DRAFT}" == "true" ]]; then
            flags+=(--draft)
          fi
          if [[ "${PRERELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${ZIP_PATH}" "${CHECKSUM_PATH}" --clobber
          else
            gh release create "${TAG_NAME}" "${ZIP_PATH}" "${CHECKSUM_PATH}" \
              --title "${TAG_NAME}" \
              --notes "ChromeUse MCP extension build for ${TAG_NAME}." \
              "${flags[@]}"
          fi
